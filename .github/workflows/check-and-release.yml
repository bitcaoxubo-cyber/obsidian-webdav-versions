name: Check and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build.js
      - run: node --test test/*.test.js
      - run: git diff --exit-code -- main.js
  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build the native NAS image
        run: |
          version=$(node -p "require('./manifest.json').version")
          image="obsidian-webdav-headless:$version"
          docker build -f headless/Dockerfile -t "$image" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$ARCH"
          echo "NAS_SYNC_IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_ARCHIVE=obsidian-webdav-headless-${version}-linux-${ARCH}.tar.gz" >> "$GITHUB_ENV"
      - name: Round-trip the release archive through Docker
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker image save "$NAS_SYNC_IMAGE" | gzip -1 > "$IMAGE_ARCHIVE"
          docker image rm "$NAS_SYNC_IMAGE"
          docker image load -i "$IMAGE_ARCHIVE"
      - name: Smoke-test Compose with loopback WebDAV
        run: node scripts/smoke-headless-docker.js
      - name: Stage the verified image for release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nas-image-${{ matrix.arch }}
          path: ${{ env.IMAGE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [check, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check release version and notes
        id: release_check
        run: |
          kind=$(node scripts/release-check.js)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - run: node scripts/build.js && node scripts/package.js
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nas-image-*
          merge-multiple: true
          path: dist
      - name: Package Compose and verify all release assets
        working-directory: dist
        run: |
          version=$(node -p "require('../manifest.json').version")
          cp ../headless/docker-compose.example.yml compose.yaml
          cp ../headless/config.example.json config.example.json
          sha256sum "obsidian-webdav-headless-${version}-linux-amd64.tar.gz" \
            "obsidian-webdav-headless-${version}-linux-arm64.tar.gz" compose.yaml config.example.json >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release with plugin and NAS assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ steps.release_check.outputs.kind }}
        run: |
          RELEASE_TAG=$(node -p "require('./manifest.json').version")
          case "$RELEASE_KIND" in
            stable) flag=--latest ;;
            prerelease) flag=--prerelease ;;
            *) exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" dist/main.js dist/manifest.json dist/*.zip dist/*.tar.gz dist/compose.yaml dist/config.example.json dist/SHA256SUMS \
            --target "$GITHUB_SHA" "$flag" \
            --title "WebDAV Versions $RELEASE_TAG" --notes-file docs/RELEASE.md
