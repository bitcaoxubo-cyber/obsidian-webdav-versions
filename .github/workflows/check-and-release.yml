name: Check and release
on:
  push:
    branches: [main, codex/release-0.4.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build.js
      - run: node --test test/*.test.js
      - run: git diff --exit-code -- main.js
  release:
    if: >-
      github.ref == 'refs/heads/codex/release-0.4.0' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.before == '25eea6c9ff31e5872cb64e5e860d0ea8f059fcbf'))
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build.js && node scripts/package.js
      - name: Publish stable release with BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(node -p "require('./manifest.json').version")
          test "$RELEASE_TAG" = "0.4.0"
          test "$(git hash-object dist/main.js)" = "00acd116dbd8ccea5b0e47536380f1c66ca9e964"
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/main.js dist/manifest.json dist/*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest \
            --title "WebDAV Versions $RELEASE_TAG" --notes-file docs/RELEASE.md
